syntax = "proto3";

package qrb.contract.geometry.v1;

import "qrb/contract/geometry/v1/pose_with_covariance.proto";

// Mirrors QRB::Memory::PoseDescriptor_t / geometry_msgs/PoseWithCovarianceStamped.
// Omitted local-only fields: pBuf, dmaHandle, pid, size, alignment, cache,
//                            allocatorType, offset, validSize, id.
message PoseWithCovarianceStamped {
    uint64             timestamp_ns         = 1;  // Acquisition timestamp (ns, CLOCK_MONOTONIC).
    string             frame_id             = 2;  // Coordinate frame identifier.
    PoseWithCovariance pose_with_covariance = 3;
}
