syntax = "proto3";

package qrb.contract.sensor.v1;

import "qrb/contract/sensor/v1/point_field.proto";
import "qrb/contract/common/v1/header.proto";

// Mirrors sensor_msgs/PointCloud2.
message PointCloud2 {
    qrb.contract.common.v1.Header header       = 1;
    uint32                        height       = 2;  // Rows; 1 for unordered clouds.
    uint32                        width        = 3;  // Points per row.
    repeated PointField           fields       = 4;  // Per-field layout descriptors.
    bool                          is_bigendian = 5;
    uint32                        point_step   = 6;  // Bytes per point.
    uint32                        row_step     = 7;  // Bytes per row (point_step * width).
    bytes                         data         = 8;  // Raw point data.
    bool                          is_dense     = 9;  // True if no NaN/Inf points.
}
