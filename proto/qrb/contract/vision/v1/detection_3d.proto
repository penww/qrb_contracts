syntax = "proto3";

package qrb.contract.vision.v1;

import "qrb/contract/geometry/v1/pose.proto";
import "qrb/contract/geometry/v1/vector3d.proto";
import "qrb/contract/vision/v1/object_hypothesis_with_pose.proto";

// Mirrors QRB::Memory::BoundingBox3d_t / vision_msgs/BoundingBox3D.
message BoundingBox3D {
    qrb.contract.geometry.v1.Pose     center = 1;  // Position and orientation of the box center.
    qrb.contract.geometry.v1.Vector3d size   = 2;  // Total size in metres along each axis.
}

// Mirrors QRB::Memory::Detection3d_t / vision_msgs/Detection3D.
message Detection3D {
    repeated ObjectHypothesisWithPose results = 1;
    BoundingBox3D                     bbox    = 2;
    string                            id      = 3;
}
